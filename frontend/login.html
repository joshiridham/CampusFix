<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – CampusFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-white min-h-screen d-flex flex-column justify-content-between">

  <!-- Minimal Nav -->
  <nav class="navbar navbar-dark navbar-custom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-shield-check text-primary fs-3"></i>
        <span class="brand-gradient">CampusFix</span>
      </a>
      <a href="register.html" class="btn btn-sm btn-outline-light">Register Account</a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="glass-card p-4 p-sm-5 text-dark shadow-2xl rounded-4">
          <div class="text-center mb-4">
            <div class="bg-blue-50 text-primary rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px; height:56px;">
              <i class="bi bi-shield-lock fs-3"></i>
            </div>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to your CampusFix portal account</p>
          </div>

          <div id="loginAlert" class="alert d-none"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control bg-light border-start-0 ps-0" id="email" placeholder="name@campusfix.edu" required autocomplete="email">
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold small">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control bg-light border-start-0 border-end-0 ps-0" id="password" placeholder="••••••••" required autocomplete="current-password">
                <span class="input-group-text bg-light border-start-0 password-toggle" id="togglePasswordBtn">
                  <i class="bi bi-eye text-muted" id="togglePasswordIcon"></i>
                </span>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mb-3 fw-bold" id="btnLoginSubmit">
              Sign In
            </button>
          </form>

          <div class="text-center mt-3 small text-muted">
            Don't have an account? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Register Student Account</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 text-center small text-slate-400">
    CampusFix System &bull; Smart College Complaint Management System
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Password visibility toggle
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('togglePasswordIcon');

      if (toggleBtn && passwordInput && toggleIcon) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleIcon.className = isPassword ? 'bi bi-eye-slash text-primary' : 'bi bi-eye text-muted';
        });
      }
    });
  </script>
</body>
</html>
