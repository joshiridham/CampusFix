<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – CampusFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-white min-h-screen d-flex flex-column justify-content-between">

  <!-- Minimal Nav -->
  <nav class="navbar navbar-dark navbar-custom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-shield-check text-primary fs-3"></i>
        <span class="brand-gradient">CampusFix</span>
      </a>
      <a href="register.html" class="btn btn-sm btn-outline-light">Register Account</a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-sm-5 text-dark shadow-2xl rounded-4">
          <div class="text-center mb-4">
            <div class="stat-icon-box bg-indigo-100 text-indigo-600 rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px; height:56px;">
              <i class="bi bi-box-arrow-in-right fs-3"></i>
            </div>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to access your CampusFix account</p>
          </div>

          <div id="loginAlert" class="alert d-none"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control bg-light border-start-0 ps-0" id="email" placeholder="e.g. student@campusfix.edu" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold small">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control bg-light border-start-0 ps-0" id="password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mb-3 fw-bold" id="btnLoginSubmit">
              Sign In
            </button>
          </form>

          <!-- Demo Fill Buttons -->
          <div class="border-top pt-3 text-center">
            <div class="text-muted small mb-2 fw-semibold">Quick Demo Login:</div>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
              <button class="btn btn-sm btn-light border" onclick="fillDemo('student@campusfix.edu', 'student123')">Student</button>
              <button class="btn btn-sm btn-light border" onclick="fillDemo('admin@campusfix.edu', 'admin123')">Admin</button>
              <button class="btn btn-sm btn-light border" onclick="fillDemo('staff.elec@campusfix.edu', 'staff123')">Staff (Elec)</button>
              <button class="btn btn-sm btn-light border" onclick="fillDemo('staff.it@campusfix.edu', 'staff123')">Staff (IT)</button>
            </div>
          </div>

          <div class="text-center mt-4 small text-muted">
            Don't have an account? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Register here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 text-center small text-slate-400">
    CampusFix System &bull; College Complaint Management System
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillDemo(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }
  </script>
</body>
</html>
