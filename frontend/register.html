<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration – CampusFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-white min-h-screen d-flex flex-column justify-content-between">

  <!-- Minimal Nav -->
  <nav class="navbar navbar-dark navbar-custom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-shield-check text-primary fs-3"></i>
        <span class="brand-gradient">CampusFix</span>
      </a>
      <a href="login.html" class="btn btn-sm btn-outline-light">Sign In</a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-sm-5 text-dark shadow-2xl rounded-4">
          <div class="text-center mb-4">
            <div class="bg-indigo-50 text-indigo-600 rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px; height:56px;">
              <i class="bi bi-mortarboard fs-3"></i>
            </div>
            <h3 class="fw-bold mb-1">Create Student Account</h3>
            <p class="text-muted small">Register to report campus complaints & track resolution</p>
          </div>

          <div id="regAlert" class="alert d-none"></div>

          <form id="registerForm">
            <!-- Fixed Student Role Indicator -->
            <div class="mb-3 p-2.5 bg-light rounded border d-flex align-items-center justify-content-between">
              <span class="small text-muted fw-semibold">Account Role</span>
              <span class="badge bg-primary px-3 py-1.5 fs-7"><i class="bi bi-mortarboard-fill me-1"></i>Student Account</span>
            </div>

            <div class="mb-3">
              <label for="name" class="form-label fw-semibold small">Full Name</label>
              <input type="text" class="form-control bg-light" id="name" placeholder="e.g. Alex Rivers" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">College Email Address</label>
              <input type="email" class="form-control bg-light" id="email" placeholder="student@campusfix.edu" required autocomplete="email">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold small">Password</label>
              <div class="input-group">
                <input type="password" class="form-control bg-light border-end-0" id="password" placeholder="••••••••" required autocomplete="new-password">
                <span class="input-group-text bg-light border-start-0 password-toggle" id="toggleRegPasswordBtn">
                  <i class="bi bi-eye text-muted" id="toggleRegPasswordIcon"></i>
                </span>
              </div>
            </div>

            <div class="mb-4">
              <label for="phone" class="form-label fw-semibold small">Phone Number (Optional)</label>
              <input type="tel" class="form-control bg-light" id="phone" placeholder="+1 555-0192">
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mb-3 fw-bold" id="btnRegSubmit">
              Create Student Account
            </button>
          </form>

          <div class="text-center mt-3 small text-muted">
            Already registered? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 text-center small text-slate-400">
    CampusFix System &bull; Smart College Complaint Management System
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggleRegPasswordBtn');
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleRegPasswordIcon');

      if (toggleBtn && passwordInput && toggleIcon) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleIcon.className = isPassword ? 'bi bi-eye-slash text-primary' : 'bi bi-eye text-muted';
        });
      }
    });
  </script>
</body>
</html>
