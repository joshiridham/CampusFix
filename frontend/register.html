<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – CampusFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-white min-h-screen d-flex flex-column justify-content-between">

  <!-- Minimal Nav -->
  <nav class="navbar navbar-dark navbar-custom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-shield-check text-primary fs-3"></i>
        <span class="brand-gradient">CampusFix</span>
      </a>
      <a href="login.html" class="btn btn-sm btn-outline-light">Sign In</a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="glass-card p-4 p-sm-5 text-dark shadow-2xl rounded-4">
          <div class="text-center mb-4">
            <div class="stat-icon-box bg-indigo-100 text-indigo-600 rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:56px; height:56px;">
              <i class="bi bi-person-plus fs-3"></i>
            </div>
            <h3 class="fw-bold mb-1">Create Account</h3>
            <p class="text-muted small">Register for Role-Based Access on CampusFix</p>
          </div>

          <div id="regAlert" class="alert d-none"></div>

          <form id="registerForm">
            <div class="mb-3">
              <label for="name" class="form-label fw-semibold small">Full Name</label>
              <input type="text" class="form-control bg-light" id="name" placeholder="e.g. John Doe" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">College Email Address</label>
              <input type="email" class="form-control bg-light" id="email" placeholder="e.g. jdoe@campusfix.edu" required>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="password" class="form-label fw-semibold small">Password</label>
                <input type="password" class="form-control bg-light" id="password" placeholder="••••••••" required>
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label fw-semibold small">Phone Number</label>
                <input type="tel" class="form-control bg-light" id="phone" placeholder="+1 555-0000">
              </div>
            </div>

            <div class="mb-3">
              <label for="roleSelect" class="form-label fw-semibold small">Select User Role</label>
              <select class="form-select bg-light" id="roleSelect" required>
                <option value="student" selected>Student</option>
                <option value="staff">Staff (Technician)</option>
                <option value="admin">Administrator</option>
              </select>
            </div>

            <div class="mb-3 d-none" id="departmentContainer">
              <label for="departmentSelect" class="form-label fw-semibold small">Staff Department</label>
              <select class="form-select bg-light" id="departmentSelect">
                <option value="Electrical">Electrical</option>
                <option value="IT/Network">IT/Network</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Equipment">Equipment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mb-3 fw-bold" id="btnRegSubmit">
              Create Account
            </button>
          </form>

          <div class="text-center mt-3 small text-muted">
            Already have an account? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 text-center small text-slate-400">
    CampusFix System &bull; College Complaint Management System
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
